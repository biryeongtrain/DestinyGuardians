plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
}

version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def gcbAvailable = new File(file(project.gcb_server_dir), 'build.gradle').exists()

repositories {
    mavenCentral()
    maven { url 'https://maven.nucleoid.xyz' }      // Polymer, sgui
    maven { url 'https://maven.blamejared.com/' }   // BetterModel 전이 의존성
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Fantasy: 타워 영구 월드. 정확한 26.3 버전을 서버 배포 JAR에 포함한다.
    implementation "xyz.nucleoid:fantasy:${project.fantasy_version}"
    include "xyz.nucleoid:fantasy:${project.fantasy_version}"

    // Polymer: 서버사이드 아이템·엔티티, 리소스팩 생성·자동 호스팅
    implementation "eu.pb4:polymer-core:${project.polymer_version}"
    implementation "eu.pb4:polymer-virtual-entity:${project.polymer_version}"
    implementation "eu.pb4:polymer-resource-pack:${project.polymer_version}"
    implementation "eu.pb4:polymer-resource-pack-extras:${project.polymer_version}"
    implementation "eu.pb4:polymer-autohost:${project.polymer_version}"

    // BetterModel: 플레이어 limb·적·보스 모델과 애니메이션 (서버에 함께 설치하는 모드, jar 에 포함하지 않음)
    implementation "io.github.toxicity188:bettermodel-fabric:${project.bettermodel_version}"

    // minigame-lib: libs/minigame-lib submodule 에서 includeBuild 로 대체됨
    implementation "kim.biryeong:minigame-lib:${project.minigamelib_version}"

    if (gcbAvailable) {
        implementation "kim.biryeong:GCB-server:${project.gcb_server_version}"
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

loom {
    runs {
        server {
            runDir = 'run/server'
        }
        client {
            runDir = 'run/client'
        }
    }
}

test {
    useJUnitPlatform()
    // 큰 1인칭 손/무기 JSON을 바닐라 codec으로 검사할 때 기본 512MiB로는 부족하다.
    maxHeapSize = '2g'
}

sourceSets {
    main {
        java {
            if (!gcbAvailable) {
                exclude 'kim/biryeong/destiny/compat/gcb/**'
            }
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'destiny-test'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'fantasy_version', project.fantasy_version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'minecraft_version': project.minecraft_version,
                'loader_version': project.loader_version,
                'fantasy_version': project.fantasy_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release.set(targetJavaVersion)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

